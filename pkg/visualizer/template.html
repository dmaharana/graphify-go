<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graphify-Go Knowledge Graph</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #canvas-container { flex: 1; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    #sidebar { width: 320px; background: #1a1a2e; border-left: 1px solid #2a2a4e; display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
    #header { padding: 14px; border-bottom: 1px solid #2a2a4e; background: #141426; }
    #header h1 { font-size: 16px; color: #64B5F6; font-weight: 600; }
    #header p { font-size: 11px; color: #888; margin-top: 4px; }
    #search-wrap { padding: 10px 14px; border-bottom: 1px solid #2a2a4e; }
    #search { width: 100%; background: #0f0f1a; border: 1px solid #3a3a5e; color: #e0e0e0; padding: 8px 10px; border-radius: 6px; font-size: 13px; outline: none; }
    #search:focus { border-color: #64B5F6; }
    #info-panel { padding: 14px; border-bottom: 1px solid #2a2a4e; max-height: 240px; overflow-y: auto; }
    #info-panel h3 { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em; }
    .prop { margin-bottom: 6px; font-size: 12px; }
    .prop b { color: #aaa; }
    #legend-wrap { flex: 1; overflow-y: auto; padding: 14px; }
    #legend-wrap h3 { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .legend-item:hover { background: #2a2a4e; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="graphCanvas"></canvas>
  </div>
  <div id="sidebar">
    <div id="header">
      <h1>Graphify-Go Knowledge Graph</h1>
      <p id="stats">Loading architecture graph...</p>
    </div>
    <div id="search-wrap">
      <input type="text" id="search" placeholder="Search symbols or files...">
    </div>
    <div id="info-panel">
      <h3>Symbol Inspector</h3>
      <div id="info-content" style="font-size: 12px; color: #777; font-style: italic;">Click a node to view connections.</div>
    </div>
    <div id="legend-wrap">
      <h3>Communities</h3>
      <div id="legend-list"></div>
    </div>
  </div>

  <script id="graph-data" type="application/json">
{{GRAPH_DATA}}
  </script>

  <script>
    const COLORS = ["#4E79A7", "#F28E2B", "#E15759", "#76B7B2", "#59A14F", "#EDC948", "#B07AA1", "#FF9DA7", "#9C755F", "#BAB0AC"];
    const data = JSON.parse(document.getElementById('graph-data').textContent);

    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    document.getElementById('stats').textContent = `${data.nodes.length} nodes · ${data.edges.length} relationships`;

    // Process nodes
    const nodeMap = new Map();
    const commCount = new Map();
    data.nodes.forEach((n, i) => {
      n.x = (Math.random() - 0.5) * 600 + width / 2;
      n.y = (Math.random() - 0.5) * 600 + height / 2;
      n.vx = 0;
      n.vy = 0;
      n.radius = n.type === 'file' ? 6 : (n.type === 'struct' || n.type === 'interface' ? 5 : 4);
      n.color = COLORS[(n.community || 1) % COLORS.length];
      nodeMap.set(n.id, n);
      commCount.set(n.community || 1, (commCount.get(n.community || 1) || 0) + 1);
    });

    // Populate legend
    const legendList = document.getElementById('legend-list');
    commCount.forEach((count, comm) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-dot" style="background:${COLORS[comm % COLORS.length]}"></span><span>Community ${comm} (${count})</span>`;
      legendList.appendChild(item);
    });

    // Camera
    let panX = 0, panY = 0, zoom = 1.0;
    let isDragging = false, startX, startY;
    let selectedNode = null;
    let searchTerm = "";

    canvas.addEventListener('mousedown', e => {
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      isDragging = true;

      // Check node click
      const mouseX = (e.clientX - panX) / zoom;
      const mouseY = (e.clientY - panY) / zoom;
      let clicked = null;
      for (const n of data.nodes) {
        const dx = n.x - mouseX, dy = n.y - mouseY;
        if (dx * dx + dy * dy < (n.radius + 4) * (n.radius + 4)) {
          clicked = n;
          break;
        }
      }
      if (clicked) {
        selectedNode = clicked;
        showInspector(clicked);
      }
    });

    window.addEventListener('mousemove', e => {
      if (isDragging) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
      }
    });

    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      zoom = Math.max(0.2, Math.min(4, zoom * factor));
    });

    document.getElementById('search').addEventListener('input', e => {
      searchTerm = e.target.value.toLowerCase().trim();
    });

    function showInspector(node) {
      const incoming = data.edges.filter(e => e.to === node.id);
      const outgoing = data.edges.filter(e => e.from === node.id);
      let html = `
        <div class="prop"><b>Name:</b> ${node.name}</div>
        <div class="prop"><b>Type:</b> <code style="color:#64B5F6">${node.type}</code></div>
        <div class="prop"><b>Community:</b> ${node.community || 'None'}</div>
        <div class="prop"><b>File:</b> ${node.file_path || '-'}</div>
        <div class="prop" style="margin-top:8px"><b>Incoming (${incoming.length}):</b></div>
      `;
      incoming.slice(0, 5).forEach(e => {
        html += `<div style="font-size:11px;color:#aaa">← ${e.from} [${e.type}]</div>`;
      });
      html += `<div class="prop" style="margin-top:8px"><b>Outgoing (${outgoing.length}):</b></div>`;
      outgoing.slice(0, 5).forEach(e => {
        html += `<div style="font-size:11px;color:#aaa">→ ${e.to} [${e.type}]</div>`;
      });
      document.getElementById('info-content').innerHTML = html;
    }

    // Force simulation step
    function step() {
      for (let i = 0; i < data.nodes.length; i++) {
        for (let j = i + 1; j < data.nodes.length; j++) {
          const a = data.nodes[i], b = data.nodes[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const distSq = dx * dx + dy * dy || 1;
          if (distSq < 15000) {
            const force = 120 / distSq;
            a.vx -= dx * force;
            a.vy -= dy * force;
            b.vx += dx * force;
            b.vy += dy * force;
          }
        }
      }

      data.edges.forEach(e => {
        const u = nodeMap.get(e.from), v = nodeMap.get(e.to);
        if (u && v) {
          const dx = v.x - u.x, dy = v.y - u.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const force = (dist - 40) * 0.005;
          u.vx += dx * force;
          u.vy += dy * force;
          v.vx -= dx * force;
          v.vy -= dy * force;
        }
      });

      data.nodes.forEach(n => {
        n.vx *= 0.85;
        n.vy *= 0.85;
        n.x += n.vx;
        n.y += n.vy;
      });
    }

    // Render loop
    function draw() {
      step();
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(zoom, zoom);

      // Edges
      ctx.lineWidth = 0.8;
      data.edges.forEach(e => {
        const u = nodeMap.get(e.from), v = nodeMap.get(e.to);
        if (u && v) {
          ctx.strokeStyle = (selectedNode && (u === selectedNode || v === selectedNode)) ? '#64B5F6' : '#2a2a4e';
          ctx.beginPath();
          ctx.moveTo(u.x, u.y);
          ctx.lineTo(v.x, v.y);
          ctx.stroke();
        }
      });

      // Nodes
      data.nodes.forEach(n => {
        const match = searchTerm && n.name.toLowerCase().includes(searchTerm);
        ctx.fillStyle = match ? '#FFD54F' : n.color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, match ? n.radius + 3 : n.radius, 0, Math.PI * 2);
        ctx.fill();

        if (n === selectedNode) {
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        if (zoom > 1.2 || match || n === selectedNode || n.type === 'file') {
          ctx.fillStyle = '#ccc';
          ctx.font = '9px sans-serif';
          ctx.fillText(n.name, n.x + n.radius + 2, n.y + 3);
        }
      });

      ctx.restore();
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
